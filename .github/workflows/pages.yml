name: Publicar biblioteca
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-covers.txt
      - run: python -m pip install -r scripts/requirements-covers.txt
      - name: Actualizar catálogo desde Drive
        run: npm run sync:drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_ROOT_ID: ${{ secrets.DRIVE_ROOT_ID }}
      - name: Buscar portadas en mods nuevos
        run: npm run import:covers
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      - run: npm test
      - run: npm run build
        env:
          FAVORITES_DATABASE_URL: ${{ vars.FAVORITES_DATABASE_URL }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Conservar portadas encontradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot/catalogo.json snapshot/media
          if [ -f snapshot/inspecciones.json ]; then git add snapshot/inspecciones.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar portadas de mods"
            git push origin HEAD:main
          fi
      - id: deploy
        uses: actions/deploy-pages@v4
